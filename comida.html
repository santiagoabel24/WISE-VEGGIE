<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wise Veggie - Registrar Comida (API)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-overlay"></div>

  <main class="container">
    <section class="logo-box">
      <img src="logoWV.png" alt="Logo Wise Veggie" class="logo">
      <h1>WISE VEGGIE</h1>
    </section>

    <section class="login-card">
      <h2>BUSCADOR DE ALIMENTOS 🌱</h2>
      <p class="extra-text" style="margin-bottom: 15px;">Conectado en tiempo real con Open Food Facts</p>
      
      <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <input type="text" id="inputBuscar" placeholder="Ej. Yogur, Galletas, Atún..." style="margin-bottom: 0;">
        <button type="button" id="btnBuscar" style="width: auto; padding: 0 20px;">🔍</button>
      </div>

      <div id="listaResultados" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px; border-radius: 8px;"></div>

      <form id="foodForm" style="display: none; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 15px;">
        <h3 id="productoSeleccionado" style="color: #2e5a36; margin-bottom: 10px;"></h3>
        
        <input type="number" id="cantidad" placeholder="¿Cuántos gramos consumiste? (g)" required>
        <input type="time" id="hora" required>
        
        <button type="submit">CONFIRMAR Y GUARDAR</button>
      </form>

      <p id="contadorCalorias" class="extra-text" style="font-weight: bold; margin-top: 15px;">
        Calorías de hoy: 0 kcal
      </p>

      <div id="resultado" style="margin-top: 20px;"></div>

      <br>
      <a href="info.html" class="link-create">Ir al Panel Nutricional →</a>
    </section>
  </main>

  <script src="registro.js"></script>
</body>
</html>
